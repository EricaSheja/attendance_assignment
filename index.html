<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Pokédex</h1>
    <input id="search" type="search" placeholder="Search by name…" aria-label="Search Pokémon by name" autocomplete="off">
  </header>

  <main>
    <p id="status" class="status" role="status">Loading Pokémon…</p>
    <div id="grid" class="grid"></div>
  </main>

  <nav class="pager">
    <button id="prev" disabled>Previous</button>
    <span id="page-label">Page 1</span>
    <button id="next">Next</button>
  </nav>

  <div id="message" class="message" role="dialog" aria-live="polite" hidden>
    <p id="message-text"></p>
    <button id="message-close">Close</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
